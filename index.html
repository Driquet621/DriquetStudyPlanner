<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>스터디 플래너 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===================== 기본 리셋 ===================== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .35s ease, color .35s ease;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font-family: inherit; color: inherit; }
  ul { list-style: none; }
  .hidden { display: none !important; }

  /* ===================== 테마 토큰 (색상 4종 × 라이트/다크 = 8조합) ===================== */
  body[data-color="pink"][data-mode="light"]{
    --bg:#FBE4EC; --bg-grad:#FCEFF3; --card-bg:#FFFFFF; --text:#4A3B42; --text-soft:#9A8590;
    --accent:#FF7CA3; --accent-dark:#F2578A; --accent-soft:#FFE1EC; --border:#FFD3E1;
    --shadow: 230,120,150; --input-bg:#FFF6F9;
  }
  body[data-color="pink"][data-mode="dark"]{
    --bg:#221A1E; --bg-grad:#271D22; --card-bg:#2F242A; --text:#F5E6EC; --text-soft:#C9A8B5;
    --accent:#FF7CA3; --accent-dark:#E85585; --accent-soft:#3D2830; --border:#4A2F3A;
    --shadow: 0,0,0; --input-bg:#291F25;
  }
  body[data-color="blue"][data-mode="light"]{
    --bg:#E6F0FB; --bg-grad:#EEF5FD; --card-bg:#FFFFFF; --text:#25384A; --text-soft:#7086A0;
    --accent:#5B93E8; --accent-dark:#3E75CC; --accent-soft:#DCEBFF; --border:#CFE1F7;
    --shadow: 90,140,220; --input-bg:#F3F8FE;
  }
  body[data-color="blue"][data-mode="dark"]{
    --bg:#151C25; --bg-grad:#1A222C; --card-bg:#1F2833; --text:#E8F0FA; --text-soft:#9CB0C6;
    --accent:#5B93E8; --accent-dark:#4A80D8; --accent-soft:#293445; --border:#324357;
    --shadow: 0,0,0; --input-bg:#1A222C;
  }
  body[data-color="mint"][data-mode="light"]{
    --bg:#E3F7EE; --bg-grad:#ECFAF3; --card-bg:#FFFFFF; --text:#20443A; --text-soft:#6C9C8B;
    --accent:#3FBE8C; --accent-dark:#2A9C70; --accent-soft:#D6F5E7; --border:#C7EDDB;
    --shadow: 60,180,140; --input-bg:#F2FBF6;
  }
  body[data-color="mint"][data-mode="dark"]{
    --bg:#142420; --bg-grad:#182B25; --card-bg:#1D2F29; --text:#E3F5EC; --text-soft:#96C2B0;
    --accent:#3FBE8C; --accent-dark:#33A87A; --accent-soft:#25392F; --border:#2F473C;
    --shadow: 0,0,0; --input-bg:#192923;
  }
  body[data-color="lavender"][data-mode="light"]{
    --bg:#F0EAFB; --bg-grad:#F5F1FC; --card-bg:#FFFFFF; --text:#372C4C; --text-soft:#8676A3;
    --accent:#9B7FE0; --accent-dark:#7C5BC9; --accent-soft:#E6DBFA; --border:#DDD0F5;
    --shadow: 140,110,220; --input-bg:#F7F3FD;
  }
  body[data-color="lavender"][data-mode="dark"]{
    --bg:#1D1725; --bg-grad:#221B2C; --card-bg:#282032; --text:#EEE7F8; --text-soft:#B4A3CC;
    --accent:#9B7FE0; --accent-dark:#8A6BD9; --accent-soft:#332941; --border:#3D3150;
    --shadow: 0,0,0; --input-bg:#221B2C;
  }
  /* 우선도 색상은 테마와 무관하게 고정 (인식성 유지) */
  :root{
    --p-high-bg:#FFE0E5; --p-high-text:#E23F5F;
    --p-mid-bg:#FFF1D0; --p-mid-text:#C97F0E;
    --p-low-bg:#DDF6E8; --p-low-text:#1F9C63;
  }

  /* ===================== UI 비율(스케일) ===================== */
  body[data-scale="s"]{ --scale: 0.86; }
  body[data-scale="m"]{ --scale: 1; }
  body[data-scale="l"]{ --scale: 1.2; }

  /* ===================== 레이아웃 ===================== */
  .app-wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 8px;
  }
  header.top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 18px;
  }
  header.top .title{
    font-family:'Gowun Dodum', cursive;
    font-size: 26px;
    letter-spacing: -0.5px;
  }
  header.top .date{
    font-size: 13px;
    color: var(--text-soft);
    margin-top: 4px;
  }
  header.top .title-row{ display:flex; flex-direction:column; }
  header.top .badge-count{
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent-dark);
    box-shadow: 0 4px 14px rgba(var(--shadow), 0.12);
  }

  /* 명언 배너 */
  .quote-card{
    background: var(--card-bg);
    border-radius: 22px;
    padding: 20px 22px;
    box-shadow: 0 8px 22px rgba(var(--shadow), 0.14);
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  .quote-card::before{
    content: "“";
    position: absolute;
    top: -18px; left: 6px;
    font-family: Georgia, serif;
    font-size: 90px;
    color: var(--accent-soft);
    line-height: 1;
    z-index: 0;
  }
  .quote-text{
    position: relative; z-index: 1;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.55;
    padding-left: 6px;
  }
  .quote-foot{
    position: relative; z-index: 1;
    display:flex; justify-content:flex-end; margin-top: 10px;
  }
  .quote-refresh{
    font-size: 12px;
    color: var(--accent-dark);
    font-weight: 700;
    display:flex; align-items:center; gap:4px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
  }
  .quote-refresh:hover{ opacity: .8; }

  /* 긴급 알림 배너 */
  .urgent-banner{
    background: linear-gradient(135deg, #FF6F7D, #FF9068);
    color: #fff;
    border-radius: 20px;
    padding: 16px 18px;
    margin-bottom: 14px;
    box-shadow: 0 8px 20px rgba(255,110,110,0.35);
    animation: pop-in .25s ease;
  }
  @keyframes pop-in{ from{ transform: scale(.96); opacity:0;} to{ transform: scale(1); opacity:1;} }
  .urgent-banner .u-title{
    font-weight: 800; font-size: 14.5px; display:flex; align-items:center; gap:6px; margin-bottom:6px;
  }
  .urgent-banner ul{ margin: 4px 0 8px 2px; }
  .urgent-banner li{ font-size: 13px; opacity: .95; padding: 2px 0; }
  .urgent-close{
    font-size: 12px; font-weight:700; background: rgba(255,255,255,0.25);
    padding: 5px 12px; border-radius: 999px; float:right;
  }

  /* 필터 탭 */
  .filter-tabs{
    display:flex; gap:8px; margin-bottom: 14px;
  }
  .filter-tabs button{
    flex:1;
    padding: calc(10px * var(--scale)) 0;
    border-radius: 14px;
    font-size: calc(13px * var(--scale));
    font-weight: 700;
    background: var(--card-bg);
    color: var(--text-soft);
    border: 1px solid var(--border);
    transition: all .2s ease;
  }
  .filter-tabs button.active{
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* 할 일 카드 */
  #taskList{ display:flex; flex-direction:column; gap: calc(12px * var(--scale)); }
  .task-card{
    background: var(--card-bg);
    border-radius: 20px;
    padding: calc(16px * var(--scale)) calc(18px * var(--scale));
    box-shadow: 0 6px 16px rgba(var(--shadow), 0.10);
    border: 1px solid transparent;
    transition: opacity .2s ease, transform .15s ease;
  }
  .task-card.overdue{ border-color: #FF8FA0; }
  .task-card.done{ opacity: .55; }
  .task-top{
    display:flex; align-items:flex-start; gap: 10px;
  }
  .task-check{
    width: calc(24px * var(--scale)); height: calc(24px * var(--scale));
    border-radius: 999px;
    border: 2px solid var(--border);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    margin-top: 2px;
  }
  .task-check.checked{ background: var(--accent); border-color: var(--accent); }
  .task-check svg{ width: 60%; height:60%; fill:#fff; opacity:0; }
  .task-check.checked svg{ opacity:1; }
  .task-main{ flex:1; min-width:0; }
  .task-head-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .task-title{
    font-size: calc(15.5px * var(--scale));
    font-weight: 700;
    word-break: break-word;
  }
  .task-card.done .task-title{ text-decoration: line-through; color: var(--text-soft); }
  .p-badge{
    font-size: calc(11px * var(--scale));
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .p-badge.high{ background: var(--p-high-bg); color: var(--p-high-text); }
  .p-badge.mid{ background: var(--p-mid-bg); color: var(--p-mid-text); }
  .p-badge.low{ background: var(--p-low-bg); color: var(--p-low-text); }
  .task-meta-row{
    display:flex; align-items:center; gap:10px; margin-top: 6px; flex-wrap:wrap;
  }
  .dday-badge{
    font-size: calc(11.5px * var(--scale));
    font-weight: 700;
    color: var(--text-soft);
  }
  .dday-badge.urgent{ color: #E2415A; }
  .dday-badge.overdue{ color: #E2415A; }
  .sub-progress{
    font-size: calc(11.5px * var(--scale));
    color: var(--text-soft);
    font-weight: 600;
  }
  .memo-indicator{ font-size: calc(12px * var(--scale)); opacity: .85; }
  .task-actions{ display:flex; align-items:center; gap: 6px; flex-shrink:0; }
  .icon-btn-sm{
    width: calc(28px * var(--scale)); height: calc(28px * var(--scale));
    border-radius: 999px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-soft);
  }
  .icon-btn-sm:hover{ background: var(--accent-soft); color: var(--accent-dark); }
  .icon-btn-sm svg{ width: 55%; height: 55%; }

  .subtask-wrap{ margin-top: 10px; padding-left: calc(34px * var(--scale)); display:none; }
  .task-card.expanded .subtask-wrap{ display:block; }
  .memo-box{
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 10px;
    font-size: calc(12.5px * var(--scale)); color: var(--text-soft);
    white-space: pre-wrap; line-height: 1.5;
  }
  .subtask-item{
    display:flex; align-items:center; gap:8px; padding: 5px 0;
    font-size: calc(13px * var(--scale));
  }
  .subtask-item .sub-check{
    width: 17px; height:17px; border-radius: 6px; border: 2px solid var(--border);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .subtask-item .sub-check.checked{ background: var(--accent); border-color: var(--accent); }
  .subtask-item .sub-check svg{ width:65%; height:65%; fill:#fff; opacity:0; }
  .subtask-item .sub-check.checked svg{ opacity:1; }
  .subtask-item span.sub-text{ flex:1; }
  .subtask-item.done span.sub-text{ text-decoration: line-through; color: var(--text-soft); }
  .subtask-add-form{
    display:flex; gap:6px; margin-top: 6px;
  }
  .subtask-add-form input{
    flex:1; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 7px 10px; font-size: 12.5px; color: var(--text);
  }
  .subtask-add-form button{
    background: var(--accent-soft); color: var(--accent-dark); font-weight:700;
    padding: 0 12px; border-radius: 10px; font-size: 12px;
  }

  .empty-state{
    text-align:center; padding: 50px 20px; color: var(--text-soft);
  }
  .empty-state .emoji{ font-size: 40px; margin-bottom: 10px; }
  .empty-state p{ font-size: 14px; font-weight: 600; }

  /* ===================== 하단 네비게이션 ===================== */
  .bottom-nav{
    position: fixed; left:0; right:0; bottom:0;
    height: calc(70px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--accent);
    display:flex; align-items:center; justify-content:space-between;
    padding-left: 32px; padding-right: 32px;
    box-shadow: 0 -6px 22px rgba(var(--shadow), 0.28);
    z-index: 50;
  }
  .nav-icon-btn{
    width: calc(44px * var(--scale)); height: calc(44px * var(--scale));
    display:flex; align-items:center; justify-content:center;
    border-radius: 999px;
  }
  .nav-icon-btn:active{ background: rgba(255,255,255,0.18); }
  .nav-icon-btn svg{ width: calc(24px * var(--scale)); height: calc(24px * var(--scale)); fill:#fff; }

  .fab{
    position:absolute; left:50%; top:-26px; transform: translateX(-50%);
    width: calc(60px * var(--scale)); height: calc(60px * var(--scale));
    border-radius: 999px;
    background: var(--card-bg);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 18px rgba(var(--shadow), 0.35);
    border: 4px solid var(--accent);
  }
  .fab svg{ width: 44%; height:44%; fill: var(--accent-dark); }
  .fab:active{ transform: translateX(-50%) scale(.94); }

  /* ===================== 모달 ===================== */
  .modal-overlay{
    position: fixed; inset:0; background: rgba(20,15,20,0.45);
    display:flex; align-items:flex-end; justify-content:center;
    z-index: 100;
    animation: fade-in .18s ease;
  }
  @keyframes fade-in{ from{opacity:0;} to{opacity:1;} }
  @media (min-width: 640px){
    .modal-overlay{ align-items:center; }
  }
  .modal{
    background: var(--bg-grad);
    width: 100%; max-width: 520px;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 26px 26px 0 0;
    padding: 22px 22px calc(26px + env(safe-area-inset-bottom));
    animation: slide-up .22s ease;
  }
  @media (min-width: 640px){
    .modal{ border-radius: 26px; margin: 20px; }
  }
  @keyframes slide-up{ from{ transform: translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal h2{
    font-family:'Gowun Dodum', cursive;
    font-size: 20px; margin-bottom: 18px;
  }
  .field{ margin-bottom: 16px; }
  .field label{
    display:block; font-size: 12.5px; font-weight:700; color: var(--text-soft); margin-bottom: 7px;
  }
  .field input[type="text"], .field input[type="date"], .field textarea{
    width:100%; background: var(--input-bg); border: 1.5px solid var(--border);
    border-radius: 14px; padding: 12px 14px; font-size: 14.5px; color: var(--text);
  }
  .field textarea{ resize: vertical; min-height: 60px; font-family: inherit; line-height: 1.5; }
  .field input:focus, .field textarea:focus{ outline:none; border-color: var(--accent); }
  .priority-select{ display:flex; gap:8px; }
  .priority-select button{
    flex:1; padding: 11px 0; border-radius: 14px; font-weight:800; font-size: 13.5px;
    border: 1.5px solid var(--border); background: var(--input-bg); color: var(--text-soft);
  }
  .priority-select button[data-p="high"].active{ background: var(--p-high-bg); color: var(--p-high-text); border-color: var(--p-high-text); }
  .priority-select button[data-p="mid"].active{ background: var(--p-mid-bg); color: var(--p-mid-text); border-color: var(--p-mid-text); }
  .priority-select button[data-p="low"].active{ background: var(--p-low-bg); color: var(--p-low-text); border-color: var(--p-low-text); }

  .draft-subtask-list{ display:flex; flex-direction:column; gap:6px; margin-bottom: 8px; }
  .draft-subtask-item{
    display:flex; align-items:center; gap:8px;
    background: var(--input-bg); border:1px solid var(--border);
    border-radius: 12px; padding: 8px 12px; font-size: 13px;
  }
  .draft-subtask-item input[type="text"]{
    flex:1; background: transparent; border: none; padding: 2px 0;
    font-size: 13px; color: var(--text);
  }
  .draft-subtask-item input[type="text"]:focus{ outline: none; }
  .draft-subtask-item .draft-sub-del{ color: var(--text-soft); font-size: 13px; flex-shrink:0; }
  .add-subtask-row{ display:flex; gap:8px; }
  .add-subtask-row input{
    flex:1; background: var(--input-bg); border:1.5px solid var(--border);
    border-radius: 14px; padding: 10px 12px; font-size: 13.5px; color: var(--text);
  }
  .add-subtask-row button{
    background: var(--accent-soft); color: var(--accent-dark); font-weight:800;
    padding: 0 16px; border-radius: 14px; font-size: 13px;
  }

  .modal-btn-row{ display:flex; gap:10px; margin-top: 22px; }
  .btn-cancel, .btn-save{
    flex:1; padding: 13px 0; border-radius: 16px; font-weight:800; font-size: 14.5px;
  }
  .btn-cancel{ background: var(--card-bg); color: var(--text-soft); border: 1.5px solid var(--border); }
  .btn-save{ background: var(--accent); color:#fff; }
  .btn-save:active, .btn-cancel:active{ transform: scale(.98); }

  /* 설정 모달 */
  .settings-section{ margin-bottom: 22px; }
  .settings-section h3{ font-size: 13.5px; font-weight:800; color: var(--text-soft); margin-bottom: 10px; }
  .theme-grid{ display:flex; gap: 12px; flex-wrap:wrap; }
  .theme-swatch{
    width: 54px; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .theme-swatch .dot{
    width: 42px; height:42px; border-radius: 999px;
    border: 3px solid transparent;
    position:relative;
  }
  .theme-swatch.active .dot{ border-color: var(--text); }
  .theme-swatch span{ font-size: 11px; color: var(--text-soft); font-weight:700; }
  .dot.t-pink{ background: linear-gradient(135deg,#FBE4EC,#FF7CA3); }
  .dot.t-blue{ background: linear-gradient(135deg,#E6F0FB,#5B93E8); }
  .dot.t-mint{ background: linear-gradient(135deg,#E3F7EE,#3FBE8C); }
  .dot.t-lavender{ background: linear-gradient(135deg,#F0EAFB,#9B7FE0); }

  .scale-options{ display:flex; gap:8px; }
  .scale-options button{
    flex:1; padding: 12px 0; border-radius: 14px; font-weight:700; font-size: 13px;
    background: var(--card-bg); border: 1.5px solid var(--border); color: var(--text-soft);
  }
  .scale-options button.active{ background: var(--accent); color:#fff; border-color: var(--accent); }
  .scale-options button small{ display:block; font-weight:600; font-size: 10.5px; margin-top:2px; opacity:.85; }

  .loading-msg{ text-align:center; padding: 40px 0; color: var(--text-soft); font-size: 13px; }

  /* ===================== 타이머 / 알람 (화면 왼쪽) ===================== */
  .timer-fab{
    position: fixed; left: 16px; top: 50%; transform: translateY(-50%);
    width: 52px; height: 52px; border-radius: 999px;
    background: var(--accent);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 20px rgba(var(--shadow), 0.35);
    z-index: 60;
  }
  .timer-fab svg{ width: 24px; height: 24px; fill:#fff; }
  .timer-fab:active{ transform: translateY(-50%) scale(.94); }

  .timer-panel{
    position: fixed; left: 16px; top: 50%; transform: translateY(-50%);
    width: 250px; max-width: calc(100vw - 32px);
    max-height: 82vh; overflow-y: auto;
    background: var(--card-bg);
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 12px 30px rgba(var(--shadow), 0.28);
    z-index: 65;
    animation: pop-in .2s ease;
  }
  .timer-panel-header{
    display:flex; align-items:center; gap:8px; margin-bottom: 14px;
  }
  .timer-mode-switch{
    display:flex; gap:6px; flex:1;
    background: var(--input-bg); padding:4px; border-radius:14px;
  }
  .timer-mode-switch button{
    flex:1; padding: 8px 0; border-radius:10px;
    font-size: 12px; font-weight:700; color: var(--text-soft);
  }
  .timer-mode-switch button.active{ background: var(--accent); color:#fff; }
  .timer-close-btn{
    width:26px; height:26px; border-radius:999px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-soft); font-size:13px;
  }
  .timer-close-btn:hover{ background: var(--accent-soft); color: var(--accent-dark); }

  .timer-alert{
    background: linear-gradient(135deg, #FF6F7D, #FF9068);
    color:#fff; border-radius:14px; padding:10px 12px;
    font-size:12.5px; font-weight:700; text-align:center; margin-bottom:12px;
  }
  .timer-alert button{
    margin-top:6px; background: rgba(255,255,255,0.25);

  <!-- ===================== Firebase (CDN, compat) ===================== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script>
  /* ============================================================
     Firebase 초기화
     모든 데이터는 students/10621 문서 아래 하위 컬렉션에 저장됩니다.
     - students/10621/tasks/{taskId}        : 할 일 데이터
     - students/10621/settings/preferences  : 테마 / UI 비율 설정
  ============================================================ */
  const firebaseConfig = {
    apiKey: "AIzaSyANA-lTFGboIfklqQewlVk49GUQ_Am33aE",
    authDomain: "garim-study-planner.firebaseapp.com",
    projectId: "garim-study-planner",
    storageBucket: "garim-study-planner.firebasestorage.app",
    messagingSenderId: "1048447885260",
    appId: "1:1048447885260:web:935234dd0c96860583c769"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const STUDENT_ID = "10621"; // 본인 학번
  const studentDoc   = db.collection('students').doc(STUDENT_ID);
  const tasksCol      = studentDoc.collection('tasks');
  const settingsDocRef = studentDoc.collection('settings').doc('preferences');

  /* ============================================================
     동기부여 명언 (원문 인용이 아닌 자체 작성 문구)
  ============================================================ */
  const QUOTES = [
    "한 걸음씩 계속 해라, 꾸준함이 결국 이긴다.",

    "느려도 상관없다. 멈추지만 마라.",
    "일단 지금 집중해라. 나중에 남들 뺑이 칠때 넌 개꿀빤다.",
    "소소한 걸 해내는게 거대한 목표의 원동력이다.",
    "목숨을 걸라고 해서 진짜 꼬라박진 말아라.",
    "그저 과거의 너와 대등해지거나 이겨라. 단지 그걸 매일 반복해라.",
    "닥치고 해라. 안되면 그때 포기해라",
    "노력은 가끔 배신할 수도 있다. 하지만 네가 그걸 했다는 사실은 배신하지 않는다.",
    "집중력은 써야 발전한다.",
    "지금 기어라. 그러면 나중엔 네가 기어가는 남들 위에 선다.",
    "계획은 사실 의지가 없다면 아무짝에도 쓸모없다.",
    "오늘 안 하면 넌 내일도 안 한다. 아니라고? 증명해봐라.",
    "만약 오늘 사정이 있어 아쉬운 결과가 나왔다면 내일 더 잘하면 된다."
    "펠리컨적 사고 : 일단 시도함"
    "누군가의 사고 : 모든 오답을 죽이고 모든 정답을 나의 품으로."
    "정말 진짜 죽는다 해도 하기 싫으면 딱 5분만 해라."
    "누구세요? 사랑해요."
    "공부가 쓸모 없다고? 공부가 입시공부만을 의미한다고 생각하나?"
  ];

  /* ============================================================
     상태
  ============================================================ */
  let tasksCache = {};       // id -> task
  let currentFilter = 'all'; // all | active | done
  let expandedIds = new Set();
  let draftSubtasks = [];    // 새 할 일 작성 중 임시 세부 할 일
  let draftPriority = 'mid';
  let currentSettings = { themeColor: 'pink', darkMode: false, scale: 'm' };

  /* ============================================================
     유틸
  ============================================================ */
  function uid(prefix){
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function todayStr(offsetDays = 0){
    const d = new Date();
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + offsetDays);
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function ddayInfo(dueDateStr){
    const today = new Date(todayStr()+'T00:00:00');
    const due = new Date(dueDateStr+'T00:00:00');
    const diff = Math.round((due - today) / 86400000);
    if (diff === 0) return { text: '오늘 마감', cls: 'urgent' };
    if (diff === 1) return { text: '내일 마감', cls: 'urgent' };
    if (diff < 0)  return { text: `${-diff}일 지남`, cls: 'overdue' };
    return { text: `D-${diff}`, cls: '' };
  }
  function priorityLabel(p){
    return p === 'high' ? '상' : p === 'low' ? '하' : '중';
  }
  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  /* ============================================================
     오늘 날짜 표시 + 랜덤 명언
  ============================================================ */
  const dayNames = ['일','월','화','수','목','금','토'];
  const now = new Date();
  document.getElementById('todayLabel').textContent =
    `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${dayNames[now.getDay()]})`;

  function showRandomQuote(){
    const q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    document.getElementById('quoteText').textContent = q;
  }
  showRandomQuote();
  document.getElementById('quoteRefreshBtn').addEventListener('click', showRandomQuote);

  /* ============================================================
     설정 (테마 / UI 비율) - Firestore 실시간 연동
  ============================================================ */
  function applySettingsToUI(settings){
    document.body.setAttribute('data-color', settings.themeColor || 'pink');
    document.body.setAttribute('data-mode', settings.darkMode ? 'dark' : 'light');
    document.body.setAttribute('data-scale', settings.scale || 'm');

    document.querySelectorAll('.theme-swatch').forEach(el=>{
      el.classList.toggle('active', el.dataset.color === (settings.themeColor || 'pink'));
    });
    document.querySelectorAll('#modeToggle button').forEach(el=>{
      el.classList.toggle('active', (el.dataset.mode === 'dark') === !!settings.darkMode);
    });
    document.querySelectorAll('#scaleOptions button').forEach(el=>{
      el.classList.toggle('active', el.dataset.scale === (settings.scale || 'm'));
    });
  }

  settingsDocRef.onSnapshot(doc=>{
    const data = doc.exists ? doc.data() : {};
    currentSettings = {
      themeColor: data.themeColor || 'pink',
      darkMode: !!data.darkMode,
      scale: data.scale || 'm'
    };
    applySettingsToUI(currentSettings);
  }, err=>{
    console.error('설정 불러오기 실패:', err);
  });

  document.getElementById('themeGrid').addEventListener('click', e=>{
    const btn = e.target.closest('.theme-swatch');
    if(!btn) return;
    settingsDocRef.set({ themeColor: btn.dataset.color }, { merge: true }).catch(console.error);
  });
  document.getElementById('modeToggle').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-mode]');
    if(!btn) return;
    settingsDocRef.set({ darkMode: btn.dataset.mode === 'dark' }, { merge: true }).catch(console.error);
  });
  document.getElementById('scaleOptions').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-scale]');
    if(!btn) return;
    settingsDocRef.set({ scale: btn.dataset.scale }, { merge: true }).catch(console.error);
  });

  /* ============================================================
     할 일 목록 - Firestore 실시간 연동
  ============================================================ */
  tasksCol.orderBy('dueDate', 'asc').onSnapshot(snapshot=>{
    tasksCache = {};
    snapshot.forEach(doc=>{
      tasksCache[doc.id] = { id: doc.id, ...doc.data() };
    });
    renderTasks();
    checkUrgentTasks();
  }, err=>{
    console.error('할 일 목록 불러오기 실패:', err);
    document.getElementById('taskList').innerHTML =
      '<div class="loading-msg">데이터를 불러오지 못했어요. Firestore 규칙을 확인해주세요.</div>';
  });

  function renderTasks(){
    const listEl = document.getElementById('taskList');
    let items = Object.values(tasksCache);

    if (currentFilter === 'active') items = items.filter(t=>!t.completed);
    if (currentFilter === 'done')   items = items.filter(t=>t.completed);

    items.sort((a,b)=>{
      if (a.completed !== b.completed) return a.completed ? 1 : -1;
      return (a.dueDate || '').localeCompare(b.dueDate || '');
    });

    const remaining = Object.values(tasksCache).filter(t=>!t.completed).length;
    document.getElementById('taskCountBadge').textContent = `${remaining}개 남음`;

    if (items.length === 0){
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="emoji">🌷</div>
          <p>${currentFilter === 'done' ? '완료한 할 일이 아직 없어요' : '오늘도 화이팅! + 버튼으로 할 일을 추가해보세요'}</p>
        </div>`;
      return;
    }

    listEl.innerHTML = items.map(t=>{
      const dd = ddayInfo(t.dueDate);
      const subtasks = t.subtasks || [];
      const doneCount = subtasks.filter(s=>s.completed).length;
      const expanded = expandedIds.has(t.id);
      const overdueClass = (!t.completed && dd.cls === 'overdue') ? 'overdue' : '';

      return `
      <div class="task-card ${t.completed ? 'done' : ''} ${overdueClass} ${expanded ? 'expanded' : ''}" data-id="${t.id}">
        <div class="task-top">
          <button class="task-check ${t.completed ? 'checked' : ''}" data-action="toggle-complete" data-id="${t.id}">
            <svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 20.6 7.4 19.2 6z"/></svg>
          </button>
          <div class="task-main" data-action="expand" data-id="${t.id}">
            <div class="task-head-row">
              <span class="p-badge ${t.priority}">${priorityLabel(t.priority)}</span>
              <span class="task-title">${escapeHtml(t.title)}</span>
            </div>
            <div class="task-meta-row">
              <span class="dday-badge ${dd.cls}">${dd.text}</span>
              ${subtasks.length ? `<span class="sub-progress">세부 ${doneCount}/${subtasks.length}</span>` : ''}
              ${t.memo ? `<span class="memo-indicator" title="메모 있음">📝</span>` : ''}
            </div>
          </div>
          <div class="task-actions">
            <button class="icon-btn-sm" data-action="edit-task" data-id="${t.id}" title="수정">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 20.3V17l10.6-10.6 3.3 3.3L7.3 20.3H4Zm14.7-13.9-1.7-1.7a1 1 0 0 1 0-1.4l1.1-1.1a1 1 0 0 1 1.4 0l1.7 1.7a1 1 0 0 1 0 1.4l-1.1 1.1a1 1 0 0 1-1.4 0Z"/></svg>
            </button>
            <button class="icon-btn-sm" data-action="delete" data-id="${t.id}" title="삭제">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 7h12l-1 13H7L6 7Zm3-3h6l1 2H8l1-2Z"/></svg>
            </button>
          </div>
        </div>
        <div class="subtask-wrap">
          ${t.memo ? `<div class="memo-box">${escapeHtml(t.memo).replace(/\n/g,'<br>')}</div>` : ''}
          <ul>
            ${subtasks.map(s=>`
              <li class="subtask-item ${s.completed ? 'done' : ''}">
                <button class="sub-check ${s.completed ? 'checked' : ''}" data-action="toggle-subtask" data-id="${t.id}" data-sub-id="${s.id}">
                  <svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 20.6 7.4 19.2 6z"/></svg>
                </button>
                <span class="sub-text">${escapeHtml(s.text)}</span>
              </li>`).join('')}
          </ul>
          <form class="subtask-add-form" data-task-id="${t.id}">
            <input type="text" placeholder="세부 할 일 추가" maxlength="40" />
            <button type="submit">추가</button>
          </form>
        </div>
      </div>`;
    }).join('');
  }

  /* 필터 탭 */
  document.querySelector('.filter-tabs').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-filter]');
    if(!btn) return;
    currentFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-tabs button').forEach(b=>b.classList.toggle('active', b===btn));
    renderTasks();
  });

  /* 할 일 카드 이벤트 위임 */
  document.getElementById('taskList').addEventListener('click', e=>{
    const actionEl = e.target.closest('[data-action]');
    if(!actionEl) return;
    const action = actionEl.dataset.action;
    const id = actionEl.dataset.id;
    const task = tasksCache[id];
    if(!task) return;

    if (action === 'toggle-complete'){
      tasksCol.doc(id).update({ completed: !task.completed }).catch(console.error);
    } else if (action === 'edit-task'){
      openTaskModal(id);
    } else if (action === 'delete'){
      if (confirm(`'${task.title}' 할 일을 삭제할까요?`)){
        tasksCol.doc(id).delete().catch(console.error);
      }
    } else if (action === 'expand'){
      if (expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
      renderTasks();
    } else if (action === 'toggle-subtask'){
      const subId = actionEl.dataset.subId;
      const newSubtasks = (task.subtasks || []).map(s=>
        s.id === subId ? { ...s, completed: !s.completed } : s
      );
      tasksCol.doc(id).update({ subtasks: newSubtasks }).catch(console.error);
    }
  });

  /* 기존 할 일에 세부 할 일 추가 */
  document.getElementById('taskList').addEventListener('submit', e=>{
    const form = e.target.closest('.subtask-add-form');
    if(!form) return;
    e.preventDefault();
    const taskId = form.dataset.taskId;
    const input = form.querySelector('input');
    const text = input.value.trim();
    if(!text) return;
    const task = tasksCache[taskId];
    const newSubtasks = [...(task.subtasks || []), { id: uid('s'), text, completed: false }];
    tasksCol.doc(taskId).update({ subtasks: newSubtasks })
      .then(()=>{ input.value=''; })
      .catch(console.error);
  });

  /* ============================================================
     긴급 알림 (마감 하루 전, 미완료)
  ============================================================ */
  function checkUrgentTasks(){
    const tomorrow = todayStr(1);
    const urgent = Object.values(tasksCache).filter(t=> !t.completed && t.dueDate === tomorrow);
    const banner = document.getElementById('urgentBanner');
    const dismissKey = 'urgentDismissed_' + todayStr();

    if (urgent.length === 0 || sessionStorage.getItem(dismissKey)){
      banner.classList.add('hidden');
      return;
    }
    document.getElementById('urgentList').innerHTML =
      urgent.map(t=>`<li>• [${priorityLabel(t.priority)}] ${escapeHtml(t.title)}</li>`).join('');
    banner.classList.remove('hidden');
  }
  document.getElementById('urgentCloseBtn').addEventListener('click', ()=>{
    sessionStorage.setItem('urgentDismissed_' + todayStr(), '1');
    document.getElementById('urgentBanner').classList.add('hidden');
  });

  /* ============================================================
     할 일 추가 모달
  ============================================================ */
  const taskModalOverlay = document.getElementById('taskModalOverlay');
  const taskTitleInput = document.getElementById('taskTitleInput');
  const taskDueInput = document.getElementById('taskDueInput');
  const taskMemoInput = document.getElementById('taskMemoInput');
  const taskModalTitleEl = document.getElementById('taskModalTitle');
  const taskSaveBtn = document.getElementById('taskSaveBtn');
  let editingTaskId = null; // null이면 새 할 일 추가, 값이 있으면 해당 id 수정

  // taskId를 주면 수정 모드로, 안 주면(또는 null) 새 할 일 추가 모드로 모달을 연다.
  function openTaskModal(taskId){
    editingTaskId = taskId || null;

    if (editingTaskId && tasksCache[editingTaskId]){
      const task = tasksCache[editingTaskId];
      taskModalTitleEl.textContent = '할 일 수정';
      taskSaveBtn.textContent = '수정 완료';
      taskTitleInput.value = task.title || '';
      taskDueInput.value = task.dueDate || todayStr(1);
      taskMemoInput.value = task.memo || '';
      draftPriority = task.priority || 'mid';
      // 배열을 그대로 참조하면 취소 시에도 원본이 바뀔 수 있어 복사해서 사용
      draftSubtasks = (task.subtasks || []).map(s=>({ ...s }));
    } else {
      taskModalTitleEl.textContent = '새 할 일 추가';
      taskSaveBtn.textContent = '저장하기';
      taskTitleInput.value = '';
      taskDueInput.value = todayStr(1);
      taskMemoInput.value = '';
      draftPriority = 'mid';
      draftSubtasks = [];
    }

    document.querySelectorAll('.priority-select button').forEach(b=>{
      b.classList.toggle('active', b.dataset.p === draftPriority);
    });
    renderDraftSubtasks();
    taskModalOverlay.classList.remove('hidden');
    setTimeout(()=>taskTitleInput.focus(), 50);
  }
  function closeTaskModal(){
    taskModalOverlay.classList.add('hidden');
    editingTaskId = null;
  }
  document.getElementById('addTaskBtn').addEventListener('click', ()=>openTaskModal(null));
  document.getElementById('taskCancelBtn').addEventListener('click', closeTaskModal);
  taskModalOverlay.addEventListener('click', e=>{
    if (e.target === taskModalOverlay) closeTaskModal();
  });

  document.querySelector('.priority-select').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-p]');
    if(!btn) return;
    draftPriority = btn.dataset.p;
    document.querySelectorAll('.priority-select button').forEach(b=>b.classList.toggle('active', b===btn));
  });

  // 세부 할 일 목록을 렌더링한다. 각 항목은 텍스트 입력창이라 바로 수정할 수 있다.
  function renderDraftSubtasks(){
    const el = document.getElementById('draftSubtaskList');
    el.innerHTML = draftSubtasks.map((s, i)=>`
      <div class="draft-subtask-item" data-idx="${i}">
        <input type="text" class="draft-sub-input" value="${escapeHtml(s.text)}" maxlength="40" placeholder="세부 할 일" />
        <button type="button" class="draft-sub-del">✕</button>
      </div>`).join('');
  }
  // 입력창에 타이핑할 때는 다시 그리지 않고 배열 값만 조용히 갱신 (다시 그리면 커서가 튐)
  document.getElementById('draftSubtaskList').addEventListener('input', e=>{
    const input = e.target.closest('.draft-sub-input');
    if(!input) return;
    const idx = Number(input.closest('.draft-subtask-item').dataset.idx);
    if (draftSubtasks[idx]) draftSubtasks[idx].text = input.value;
  });
  document.getElementById('draftSubtaskList').addEventListener('click', e=>{
    const btn = e.target.closest('.draft-sub-del');
    if(!btn) return;
    const idx = Number(btn.closest('.draft-subtask-item').dataset.idx);
    draftSubtasks.splice(idx, 1);
    renderDraftSubtasks();
  });
  function addDraftSubtask(){
    const input = document.getElementById('draftSubtaskInput');
    const text = input.value.trim();
    if(!text) return;
    draftSubtasks.push({ id: uid('s'), text, completed: false });
    input.value = '';
    renderDraftSubtasks();
    input.focus();
  }
  document.getElementById('draftSubtaskAddBtn').addEventListener('click', addDraftSubtask);
  document.getElementById('draftSubtaskInput').addEventListener('keydown', e=>{
    if (e.key === 'Enter'){ e.preventDefault(); addDraftSubtask(); }
  });

  taskSaveBtn.addEventListener('click', ()=>{
    const title = taskTitleInput.value.trim();
    const dueDate = taskDueInput.value;
    const memo = taskMemoInput.value.trim();
    if (!title){ alert('할 일 제목을 입력해주세요.'); taskTitleInput.focus(); return; }
    if (!dueDate){ alert('마감일을 선택해주세요.'); taskDueInput.focus(); return; }

    // 내용이 비어버린 세부 할 일은 저장 시 제외
    const cleanedSubtasks = draftSubtasks
      .map(s=>({ ...s, text: s.text.trim() }))
      .filter(s=>s.text.length > 0);

    if (editingTaskId){
      tasksCol.doc(editingTaskId).update({
        title, priority: draftPriority, dueDate, memo, subtasks: cleanedSubtasks
      }).then(closeTaskModal).catch(err=>{
        console.error(err);
        alert('수정에 실패했어요. 잠시 후 다시 시도해주세요.');
      });
    } else {
      tasksCol.add({
        title,
        priority: draftPriority,
        dueDate,
        memo,
        completed: false,
        subtasks: cleanedSubtasks,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(closeTaskModal).catch(err=>{
        console.error(err);
        alert('저장에 실패했어요. 잠시 후 다시 시도해주세요.');
      });
    }
  });

  /* ============================================================
     설정 모달
  ============================================================ */
  const settingsModalOverlay = document.getElementById('settingsModalOverlay');
  document.getElementById('settingsBtn').addEventListener('click', ()=>{
    applySettingsToUI(currentSettings);
    settingsModalOverlay.classList.remove('hidden');
  });
  document.getElementById('settingsCloseBtn').addEventListener('click', ()=>{
    settingsModalOverlay.classList.add('hidden');
  });
  settingsModalOverlay.addEventListener('click', e=>{
    if (e.target === settingsModalOverlay) settingsModalOverlay.classList.add('hidden');
  });

  /* ============================================================
     홈 버튼: 모달 닫고 필터를 '전체'로, 최상단으로 스크롤
  ============================================================ */
  document.getElementById('homeBtn').addEventListener('click', ()=>{
    taskModalOverlay.classList.add('hidden');
    settingsModalOverlay.classList.add('hidden');
    currentFilter = 'all';
    document.querySelectorAll('.filter-tabs button').forEach(b=>b.classList.toggle('active', b.dataset.filter==='all'));
    renderTasks();
    window.scrollTo({ top:0, behavior:'smooth' });
  });

  /* ============================================================
     타이머 / 알람 패널 (화면 왼쪽, 세션 동안만 유지되는 기능)
  ============================================================ */
  const timerFab = document.getElementById('timerFab');
  const timerPanel = document.getElementById('timerPanel');
  const timerPanelCloseBtn = document.getElementById('timerPanelCloseBtn');
  const timerAlertBox = document.getElementById('timerAlertBox');
  const timerView = document.getElementById('timerView');
  const alarmView = document.getElementById('alarmView');

  function openTimerPanel(){
    timerPanel.classList.remove('hidden');
    timerFab.classList.add('hidden');
  }
  function closeTimerPanel(){
    timerPanel.classList.add('hidden');
    timerFab.classList.remove('hidden');
  }
  timerFab.addEventListener('click', openTimerPanel);
  timerPanelCloseBtn.addEventListener('click', closeTimerPanel);

  document.querySelector('.timer-mode-switch').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-tmode]');
    if(!btn) return;
    document.querySelectorAll('.timer-mode-switch button').forEach(b=>b.classList.toggle('active', b===btn));
    const mode = btn.dataset.tmode;
    timerView.classList.toggle('hidden', mode !== 'timer');
    alarmView.classList.toggle('hidden', mode !== 'alarm');
  });

  function hideTimerAlert(){
    timerAlertBox.classList.add('hidden');
    timerAlertBox.innerHTML = '';
  }
  function showTimerAlert(message){
    timerAlertBox.innerHTML = `${message}<div><button type="button" id="timerAlertOkBtn">확인</button></div>`;
    timerAlertBox.classList.remove('hidden');
    document.getElementById('timerAlertOkBtn').addEventListener('click', hideTimerAlert);
  }

  // 외부 음원 파일 없이 Web Audio API로 짧은 알림음을 만든다.
  function playAlertBeep(times){
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      let t = ctx.currentTime;
      for (let i = 0; i < (times || 3); i++){
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 880;
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
        osc.start(t);
        osc.stop(t + 0.3);
        t += 0.4;
      }
    }catch(err){
      console.error('알림음 재생 실패:', err);
    }
  }

  /* ---- 타이머 ---- */
  const timerDisplay = document.getElementById('timerDisplay');
  const timerMinInput = document.getElementById('timerMinInput');
  const timerSecInput = document.getElementById('timerSecInput');
  const timerStartPauseBtn = document.getElementById('timerStartPauseBtn');
  const timerResetBtn = document.getElementById('timerResetBtn');

  let timerIntervalId = null;
  let timerRunning = false;
  // 아직 한 번도 시작하지 않았거나(혹은 초기화/종료 직후) 입력값을 그대로 반영해야 하는 상태인지
  let timerIsFresh = true;

  function formatClock(totalSec){
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  function refreshTimerDisplay(){
    timerDisplay.textContent = formatClock(timerRemainingSec);
  }

  function readTimerInputSeconds(){
    const mins = Math.max(0, Math.min(180, parseInt(timerMinInput.value, 10) || 0));
    const secs = Math.max(0, Math.min(59, parseInt(timerSecInput.value, 10) || 0));
    return mins * 60 + secs;
  }

  let timerRemainingSec = readTimerInputSeconds();
  refreshTimerDisplay();

  // 아직 시작 전(=fresh) 상태에서 분/초 입력을 바꾸면 큰 숫자 표시에 바로 반영된다.
  function syncTimerFromInputsIfFresh(){
    if (timerIsFresh && !timerRunning){
      timerRemainingSec = readTimerInputSeconds();
      refreshTimerDisplay();
    }
  }
  timerMinInput.addEventListener('input', syncTimerFromInputsIfFresh);
  timerSecInput.addEventListener('input', syncTimerFromInputsIfFresh);

  function startTimer(){
    if (timerIsFresh){
      timerRemainingSec = readTimerInputSeconds();
    }
    if (timerRemainingSec <= 0){
      alert('타이머 시간을 먼저 설정해주세요.');
      return;
    }
    timerIsFresh = false;
    hideTimerAlert();
    timerRunning = true;
    timerStartPauseBtn.textContent = '일시정지';
    timerIntervalId = setInterval(()=>{
      timerRemainingSec--;
      refreshTimerDisplay();
      if (timerRemainingSec <= 0){
        clearInterval(timerIntervalId);
        timerRunning = false;
        timerIsFresh = true;
        timerStartPauseBtn.textContent = '시작';
        playAlertBeep(3);
        showTimerAlert('⏰ 타이머가 끝났어요!');
      }
    }, 1000);
  }
  function pauseTimer(){
    clearInterval(timerIntervalId);
    timerRunning = false;
    timerStartPauseBtn.textContent = '시작';
  }
  timerStartPauseBtn.addEventListener('click', ()=>{
    if (timerRunning) pauseTimer(); else startTimer();
  });
  timerResetBtn.addEventListener('click', ()=>{
    clearInterval(timerIntervalId);
    timerRunning = false;
    timerIsFresh = true;
    timerStartPauseBtn.textContent = '시작';
    timerRemainingSec = readTimerInputSeconds();
    refreshTimerDisplay();
    hideTimerAlert();
  });

  /* ---- 알람 ---- */
  let alarms = []; // { id, time: 'HH:MM' }
  const alarmFiredMinuteById = {}; // 같은 분에 여러 번 울리지 않도록 기록

  function renderAlarmList(){
    const listEl = document.getElementById('alarmList');
    const emptyHint = document.getElementById('alarmEmptyHint');
    if (alarms.length === 0){
      listEl.innerHTML = '';
      emptyHint.classList.remove('hidden');
      return;
    }
    emptyHint.classList.add('hidden');
    listEl.innerHTML = alarms
      .slice()
      .sort((a,b)=>a.time.localeCompare(b.time))
      .map(a=>`
        <li class="alarm-item">
          <span>⏰ ${a.time}</span>
          <button type="button" data-alarm-id="${a.id}">✕</button>
        </li>`).join('');
  }
  renderAlarmList();

  document.getElementById('alarmAddBtn').addEventListener('click', ()=>{
    const input = document.getElementById('alarmTimeInput');
    const time = input.value;
    if (!time){ alert('알람 시각을 선택해주세요.'); return; }
    if (alarms.some(a=>a.time === time)){ alert('이미 같은 시각에 알람이 있어요.'); return; }
    alarms.push({ id: uid('a'), time });
    renderAlarmList();
  });
  document.getElementById('alarmList').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-alarm-id]');
    if(!btn) return;
    alarms = alarms.filter(a=>a.id !== btn.dataset.alarmId);
    renderAlarmList();
  });

  // 15초마다 현재 시각과 알람 목록을 비교해서 일치하면 알림을 띄운다.
  setInterval(()=>{
    const nowTime = new Date();
    const hhmm = `${String(nowTime.getHours()).padStart(2,'0')}:${String(nowTime.getMinutes()).padStart(2,'0')}`;
    alarms.forEach(a=>{
      if (a.time === hhmm && alarmFiredMinuteById[a.id] !== hhmm){
        alarmFiredMinuteById[a.id] = hhmm;
        playAlertBeep(4);
        showTimerAlert(`⏰ 설정하신 ${a.time} 알람 시간이에요!`);
        openTimerPanel();
        document.querySelectorAll('.timer-mode-switch button').forEach(b=>{
          b.classList.toggle('active', b.dataset.tmode === 'alarm');
        });
        timerView.classList.add('hidden');
        alarmView.classList.remove('hidden');
      }
    });
  }, 15000);
  </script>
</body>
</html>
